<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blobbo Rangliste einrichten</title>
<style>
  :root { color-scheme: dark; --bg: #1b1640; --panel: #2a2163; --fg: #fff; --muted: #c9c3f0; --ok: #20c997; --err: #ff6b81; --acc: #ffd93d; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 20px max(16px, env(safe-area-inset-left)); }
  .card { width: min(420px, 100%); background: var(--panel); border-radius: 22px; padding: 24px 20px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 26px; }
  p { margin: 8px 0; color: var(--muted); }
  button { width: 100%; margin-top: 14px; padding: 16px; border: 0; border-radius: 16px; font: inherit; font-weight: 700; font-size: 20px;
    background: var(--ok); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; }
  .id { margin-top: 16px; padding: 14px; border-radius: 14px; background: var(--bg); color: var(--acc); font: 700 20px/1.3 ui-monospace, monospace;
    word-break: break-all; user-select: all; -webkit-user-select: all; }
  .msg { margin-top: 12px; min-height: 24px; font-size: 14px; text-align: left; }
  .err { color: var(--err); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>🏆 Rangliste einrichten</h1>
  <p>Ein Tipp legt die weltweite Rangliste für Blobbo an. Das muss nur einmal gemacht werden.</p>
  <button id="go">Rangliste anlegen</button>
  <div id="out" class="hidden">
    <p>Fertig! Schick diese Nummer an Claude:</p>
    <div class="id" id="id"></div>
    <button id="copy">Nummer kopieren</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script src="store.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const log = (t, cls) => { const d = document.createElement('div'); d.textContent = t; if (cls) d.className = cls; $('msg').appendChild(d); };
  $('go').onclick = async () => {
    $('go').disabled = true;
    $('msg').textContent = '';
    for (const [code, p] of Object.entries(BlobboStore.providers)) {
      try {
        const id = await p.create({ app: 'blobbo', scores: [] });
        // Test: schreiben und wieder lesen
        await p.write(id, { app: 'blobbo', scores: [], test: 1 });
        const back = await p.read(id);
        if (!back || back.test !== 1) throw new Error('Lesetest fehlgeschlagen');
        await p.write(id, { app: 'blobbo', scores: [] });
        log('✓ ' + p.name);
        $('id').textContent = code + ':' + id;
        $('out').classList.remove('hidden');
        $('go').classList.add('hidden');
        return;
      } catch (e) {
        log('✗ ' + p.name + ': ' + e.message, 'err');
      }
    }
    log('Leider hat kein Dienst funktioniert. Schick Claude bitte einen Screenshot.', 'err');
    $('go').disabled = false;
  };
  $('copy').onclick = async () => {
    const t = $('id').textContent;
    try { await navigator.clipboard.writeText(t); $('copy').textContent = 'Kopiert ✓'; }
    catch (e) {
      const r = document.createRange(); r.selectNodeContents($('id'));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      $('copy').textContent = 'Markiert – jetzt kopieren';
    }
  };
</script>
</body>
</html>
