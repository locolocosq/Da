<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blobbo Rangliste einrichten</title>
<style>
  :root { color-scheme: dark; --bg: #1b1640; --panel: #2a2163; --fg: #fff; --muted: #c9c3f0; --ok: #20c997; --err: #ff6b81; --acc: #ffd93d; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 20px max(16px, env(safe-area-inset-left)); }
  .card { width: min(420px, 100%); background: var(--panel); border-radius: 22px; padding: 24px 20px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 26px; }
  p { margin: 8px 0; color: var(--muted); }
  button { width: 100%; margin-top: 14px; padding: 16px; border: 0; border-radius: 16px; font: inherit; font-weight: 700; font-size: 20px;
    background: var(--ok); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; }
  .id { margin-top: 16px; padding: 14px; border-radius: 14px; background: var(--bg); color: var(--acc); font: 700 20px/1.3 ui-monospace, monospace;
    word-break: break-all; user-select: all; -webkit-user-select: all; }
  .msg { margin-top: 12px; min-height: 24px; }
  .err { color: var(--err); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>🏆 Rangliste einrichten</h1>
  <p>Ein Tipp legt die weltweite Rangliste für Blobbo an. Das muss nur einmal gemacht werden.</p>
  <button id="go">Rangliste anlegen</button>
  <div id="out" class="hidden">
    <p>Fertig! Schick diese Nummer an Claude:</p>
    <div class="id" id="id"></div>
    <button id="copy">Nummer kopieren</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  $('go').onclick = async () => {
    $('go').disabled = true;
    $('msg').textContent = 'Lege an…';
    $('msg').className = 'msg';
    try {
      const res = await fetch('https://jsonblob.com/api/jsonBlob', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ app: 'blobbo', scores: [] }),
      });
      if (!res.ok) throw new Error('Antwort ' + res.status);
      const loc = res.headers.get('Location') || res.headers.get('location') || '';
      const id = res.headers.get('X-jsonblob') || res.headers.get('x-jsonblob') || loc.split('/').pop();
      if (!id) throw new Error('Keine Nummer erhalten');
      $('id').textContent = id;
      $('out').classList.remove('hidden');
      $('go').classList.add('hidden');
      $('msg').textContent = '';
    } catch (e) {
      $('go').disabled = false;
      $('msg').className = 'msg err';
      $('msg').textContent = 'Hat nicht geklappt (' + e.message + '). Bitte nochmal tippen.';
    }
  };
  $('copy').onclick = async () => {
    const t = $('id').textContent;
    try { await navigator.clipboard.writeText(t); $('copy').textContent = 'Kopiert ✓'; }
    catch (e) {
      const r = document.createRange(); r.selectNodeContents($('id'));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      $('copy').textContent = 'Markiert – jetzt kopieren';
    }
  };
</script>
</body>
</html>
